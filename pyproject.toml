[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navieco"
version = "0.1.0a1"
description = "NAViECO: navigating longitudinal immunotherapy ecosystems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9"
]

authors = [
    {name = "Jianpeng Zhang"}
]

keywords = [
    "single-cell",
    "scRNA-seq",
    "immunotherapy",
    "immune-checkpoint-blockade",
    "tumor-microenvironment",
    "cell-state",
    "multicellular-ecosystem"
]

[project.urls]
Homepage = "https://github.com/LuckyRaphael/NAViECO"
Repository = "https://github.com/LuckyRaphael/NAViECO"
Issues = "https://github.com/LuckyRaphael/NAViECO/issues"

[tool.setuptools.packages.find]
where = ["src"]
