[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navieco"
version = "0.1.0a1"
description = "NAViECO: Navigating Immune Ecosystems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

authors = [
    {name = "Jianpeng Zhang"}
]

keywords = [
    "single-cell",
    "scRNA-seq",
    "CONCORD",
    "immunotherapy",
    "cell-state",
    "multicellular-ecosystem"
]

[project.urls]
Homepage = "https://github.com/LuckyRaphael/NAViECO"
Repository = "https://github.com/LuckyRaphael/NAViECO"
Issues = "https://github.com/LuckyRaphael/NAViECO/issues"

[tool.setuptools.packages.find]
where = ["src"]
