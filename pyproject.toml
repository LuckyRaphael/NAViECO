[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navieco"
version = "0.1.0a2"
description = "NAViECO: Navigating Immune Ecosystems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.12,<1",
    "scanpy>=1.11,<2",
    "numpy>=1.26,<3",
    "pandas>=2,<3",
    "scipy>=1.11,<2",
    "torch>=2.2,<3",
    "concord-sc==1.0.13",
    "matplotlib>=3.6,<4"
]

authors = [
    {name = "Jianpeng Zhang"}
]

keywords = [
    "single-cell",
    "scRNA-seq",
    "CONCORD",
    "immunotherapy",
    "cell-state",
    "multicellular-ecosystem"
]

[project.urls]
Homepage = "https://github.com/LuckyRaphael/NAViECO"
Repository = "https://github.com/LuckyRaphael/NAViECO"
Issues = "https://github.com/LuckyRaphael/NAViECO/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
navieco = ["data/*.tsv.gz", "data/*.txt"]
